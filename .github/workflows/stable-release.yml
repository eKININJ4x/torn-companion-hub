name: Publish stable release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - release-version.txt
      - CHANGELOG.md
      - .github/workflows/stable-release.yml
permissions:
  contents: write
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Publish the recorded stable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat release-version.txt)
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version"
            exit 1
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Stable release already exists: $version"
            exit 0
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "Torn Companion Hub $version" --notes-file CHANGELOG.md --latest
