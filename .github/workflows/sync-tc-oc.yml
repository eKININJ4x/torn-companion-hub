name: Sync TC OC installer
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync-tc-oc.py
      - .github/workflows/sync-tc-oc.yml
permissions:
  contents: write
concurrency:
  group: sync-tc-oc
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate and mirror a newer canonical release
        run: python3 scripts/sync-tc-oc.py
      - name: Publish changed installer
        run: |
          if git diff --quiet -- public/scripts/tc-oc.user.js; then
            echo "No new TC OC release to publish."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/scripts/tc-oc.user.js
          git commit -m 'Update hosted TC OC installer from canonical release'
          git pull --rebase origin main
          git push origin HEAD:main
